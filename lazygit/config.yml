keybinding:
  universal:
    openDiffTool: <disabled>
customCommands:
  - key: "h"
    command: 'tmux new-window -n tuicr "tuicr -w"'
    context: "files"
    description: "Open tuicr working tree review"
    output: terminal
  - key: "h"
    command: 'tmux new-window -n tuicr "tuicr -r {{ .SelectedCommit.Hash }}"'
    context: "commits"
    description: "Open selected commit in tuicr"
  - key: "v"
    context: "files"
    description: "Browse file history in tmux window"
    command: >
      tmux new-window 'FILE=$(git ls-files | fzf --prompt="Select a file to see its commit history: ") && EXT="${FILE##*.}" && git log --follow --date="format:%a %D %H:%M" --format="%h %ad %an" "$FILE" | fzf --prompt="Select a commit hash: " --preview "git show {1}:$FILE | bat --color=always -l $EXT" | awk "{print \$1}" | xargs -I{} sh -c "git show {}:$FILE | nvim -c \"set ft=$EXT\" -"'
